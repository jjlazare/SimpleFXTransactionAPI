spring.datasource.url=jdbc:h2:file:./data/wexdb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.show-sql=false

server.port=8443

treasury.reference.refresh.enabled=false
treasury.reference.refresh.ms=30000
treasury.base-url=https://api.fiscaldata.treasury.gov/services/api/fiscal_service

# Self-signed SSL configuration for local development/interview purposes.
# In production, these values should be supplied via environment variables or a secure vault

server.ssl.enabled=true

server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeme
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=wex
spring.datasource.password=

logging.file.name=logs/wex-app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=INFO