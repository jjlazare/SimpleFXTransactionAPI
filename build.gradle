plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.openapi.generator' version '7.4.0'
}

group = 'com.example.wex'
version = '1.0.0'
description = 'WEX Purchase Transaction Service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'org.springframework:spring-webflux'
    implementation 'io.projectreactor.netty:reactor-netty-http'


    compileOnly 'org.projectlombok:lombok:1.18.32'

    runtimeOnly 'com.h2database:h2'

    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.wiremock:wiremock-standalone:3.3.1'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    archiveFileName = 'wex-purchase-service.jar'
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$projectDir/src/main/resources/openapi.yaml".replace("\\", "/")
    outputDir = "$buildDir/generated"
    apiPackage = "com.example.wex.api"
    modelPackage = "com.example.wex.model"
    invokerPackage = "com.example.wex.invoker"
    generateApiTests = false
    generateModelTests = false
    configOptions = [
            dateLibrary: "java8",
            interfaceOnly: "true",
            useSpringBoot3: "true",
            useTags: "true",
            skipDefaultInterface: "true"
    ]
}

sourceSets {
        main {
            java {
                srcDir("$buildDir/generated/src/main/java")
            }
            resources {
                srcDirs = ['src/main/resources']
            }

        }

        test {
            java {
                srcDirs = ['src/main/test/java']
            }
            resources {
                srcDirs = ['src/main/test/resources']
            }
        }
    }


tasks.named("compileJava") {
    dependsOn("openApiGenerate")
}
